name: Question
description: Ask about usage, behaviour, or whether something is intended
title: "[question] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Check the [README](https://github.com/bmmmm/epcii#readme) first —
        install, all flags, and the payload rules are documented there. If
        the answer turns out to be "that's a bug," we'll convert this into a
        proper report — don't worry about picking the wrong form.

  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true

  - type: input
    id: command
    attributes:
      label: Command or steps that led here, if any

  - type: textarea
    id: output
    attributes:
      label: Output or behaviour you're asking about
      render: text
