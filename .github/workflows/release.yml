name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # create the release and upload its assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The tag name becomes part of every asset file name.
      - name: Check tag name
        run: |
          case "$GITHUB_REF_NAME" in
            */*|*' '*) echo "::error::tag must not contain '/' or spaces: $GITHUB_REF_NAME"; exit 1 ;;
          esac

      # The full merge gate, repeated here: ci.yml runs on the same tag push
      # but concurrently, so it cannot hold this job back.
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...

      # Notes come from CHANGELOG.md, not from the commit list: a release
      # describes what changed for a user. This runs before the build so a
      # missing section costs nothing; notes.md stays in the repo root so the
      # dist/* glob cannot pick it up as an asset. The section ends at the next
      # "## " heading, whether or not it carries link brackets, so trailing
      # link-reference definitions never leak into the last section's notes.
      - name: Release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v want="## [$version]" '
            index($0, want) == 1 { inside = 1; next }
            inside && /^## /      { exit }
            inside                { print }
          ' CHANGELOG.md > notes.md
          if [ -z "$(tr -d '[:space:]' < notes.md)" ]; then
            echo "::error::CHANGELOG.md has no entries for $version — write them before tagging"
            exit 1
          fi
          cat notes.md

      # One job, one loop — a matrix would scatter the binaries across jobs and
      # no single job could then checksum all of them.
      - name: Build binaries
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            goos=${target%/*}
            goarch=${target#*/}
            out="dist/epcii_${GITHUB_REF_NAME}_${goos}_${goarch}"
            if [ "$goos" = windows ]; then
              out="$out.exe"
            fi
            echo "building $out"
            GOOS="$goos" GOARCH="$goarch" go build \
              -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "$out" .
          done

      - name: Checksums
        working-directory: dist
        run: sha256sum epcii_* > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --notes-file notes.md dist/*
