name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Windows is the job that earns the matrix: it is the only place where the
    # .gitattributes eol=lf policy meets a fixture compared byte for byte
    # (internal/qr/testdata/matrix_fingerprints.txt — the *.golden files are
    # exempt via -text), and the only one that runs writePNG's non-POSIX
    # branch. The two POSIX-only PNG tests skip there, by design.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Formatting and the provenance diff are one-runner concerns: the answer
      # cannot differ per OS, and the pipeline below has no Windows shell form.
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - run: go build .
      # The web build (cmd/epcii-wasm, tagged js&&wasm, so `go vet ./...`
      # never sees it) must compile, and its SVG/PNG must equal the CLI's byte
      # for byte. One runner: the wasm target does not vary by host OS.
      - name: Web build + smoke
        if: runner.os == 'Linux'
        run: |
          GOOS=js GOARCH=wasm go vet ./cmd/epcii-wasm
          scripts/build-web.sh
          node scripts/web-smoke.mjs
      # The upstream fixture must stay reproducible from the pinned
      # piglig/go-qr, so the generator (its own module, outside ./...) is
      # built and its output compared byte for byte on every run.
      - name: Upstream fixture provenance
        if: runner.os == 'Linux'
        run: go run -C scripts/qrfixtures . | diff - internal/qr/testdata/matrix_fingerprints.txt

      # Both are Linux-only: neither finding depends on the runner, and paying
      # for three of each buys nothing.
      #
      # -race is a tripwire, not a gate that can fire today: this module has no
      # goroutine, channel, sync primitive or t.Parallel, so there is nothing
      # for the detector to find. It is here so the first concurrent code added
      # arrives with the detector already running, and costs ~20 s to say so.
      - name: Race detector
        if: runner.os == 'Linux'
        run: go test -race ./...
      # Pinning the tool keeps its own behaviour reproducible; it does NOT make
      # this step deterministic — the advisory data is fetched from vuln.go.dev
      # at run time, so a new advisory against the standard library can turn an
      # untouched PR red. That is the point of the check, not a defect.
      # `go run pkg@version` resolves outside the module, so the zero-dependency
      # go.mod must come through untouched; the diff asserts that contract.
      - name: govulncheck
        if: runner.os == 'Linux'
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
          git diff --exit-code go.mod go.sum
