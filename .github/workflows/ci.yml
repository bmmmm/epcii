name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Windows is the job that earns the matrix: it is the only place where the
    # .gitattributes LF policy meets the byte-exact golden fixtures, and where
    # the PNG tests take their non-POSIX branch.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Formatting and the provenance diff are one-runner concerns: the answer
      # cannot differ per OS, and the pipeline below has no Windows shell form.
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - run: go build .
      # The upstream fixture must stay reproducible from the pinned
      # piglig/go-qr, so the generator (its own module, outside ./...) is
      # built and its output compared byte for byte on every run.
      - name: Upstream fixture provenance
        if: runner.os == 'Linux'
        run: go run -C scripts/qrfixtures . | diff - internal/qr/testdata/matrix_fingerprints.txt

      # Both are Linux-only on purpose: neither finding depends on the runner,
      # and paying for three of each buys nothing. govulncheck is pinned like
      # any other tool — @latest would let a new release turn the gate red
      # without a commit here. `go run pkg@version` resolves outside the module,
      # so the zero-dependency go.mod stays untouched; the check below proves it.
      - name: Race detector
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: govulncheck
        if: runner.os == 'Linux'
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
          git diff --exit-code go.mod go.sum
