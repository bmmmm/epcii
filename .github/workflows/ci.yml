name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - run: go build .
      # The upstream fixture must stay reproducible from the pinned
      # piglig/go-qr, so the generator (its own module, outside ./...) is
      # built and its output compared byte for byte on every run.
      - name: Upstream fixture provenance
        run: go run -C scripts/qrfixtures . | diff - internal/qr/testdata/matrix_fingerprints.txt
